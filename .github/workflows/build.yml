name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - "engine/**"
      - ".github/workflows/engine.yml"
      - ".github/workflows/extract-bootstrap.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build debug APKs
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:assembleDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          for f in app/build/outputs/apk/debug/*.apk; do
            n=$(basename "$f" | sed 's/^app-/ceno-probe-/')
            cp "$f" "out/$n"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ceno-probe-apks
          path: out/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="probe-${{ github.run_number }}"
          gh release create "$tag" out/*.apk \
            --title "Ceno Probe build ${{ github.run_number }}" \
            --notes "Test build. arm64-v8a fits almost every phone from the last few years." \
            --prerelease
